# Render blueprint for the Canopy backend.
#
# Frontend goes to Vercel separately; this service cannot (DECISIONS.md D15).
#
# Every value below is non-secret. The four secrets are marked sync:false and
# must be set in the Render dashboard, never committed:
#
#   DATABASE_URL           Supabase session pooler string (port 5432, not 6543)
#   AWS_ACCESS_KEY_ID      IAM user with bedrock:InvokeModel only
#   AWS_SECRET_ACCESS_KEY
#   API_KEY                shared demo key; must match the frontend's VITE_API_KEY

services:
  - type: web
    name: canopy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AWS_REGION
        value: us-east-1
      - key: NOVA_EMBED_MODEL_ID
        value: amazon.nova-2-multimodal-embeddings-v1:0
      - key: NOVA_LITE_MODEL_ID
        value: global.amazon.nova-2-lite-v1:0
      - key: RELEVANCE_THRESHOLD
        value: "0.44"
      - key: EMBED_CONCURRENCY
        value: "8"

      # Empty on first deploy: the Vercel URL does not exist yet. Set it after
      # the frontend is up. Declared with a value rather than sync:false so the
      # blueprint does not block on something unknowable at this point.
      # localhost origins are allowed unconditionally in main.py, so an empty
      # value here is correct for a backend-only deploy.
      - key: ALLOWED_ORIGINS
        value: ""

      # Render generates a strong random value on first deploy. Read it from the
      # dashboard afterwards and set the frontend's VITE_API_KEY to match --
      # better than inventing one, and it never sits in a chat or a file.
      - key: API_KEY
        generateValue: true

      # The three that genuinely require you: paste in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
